spring:
  application:
    name: photo-cloud-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml
    enabled: true
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: validate
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
  mail:
    host: smtp.yandex.ru
    port: 465
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    mail-from: ${SMTP_USERNAME}@yandex.ru
    properties: # передаются в JavaMailSenderImpl из MailConfig; лимиты отдельных сетевых операций, не всей отправки
      mail:
        smtp:
          connectiontimeout: 5000 # мс, установление соединения
          timeout: 5000 # мс, каждое чтение ответа сервера
          writetimeout: 5000 # мс, каждая запись в сокет
          quitwait: false # не ждать ответа на QUIT после принятого письма
  servlet:
    multipart:
      max-file-size: 110MB
      max-request-size: 110MB
      file-size-threshold: 0

server:
  servlet:
    context-path: /
  port: 8080

token:
  signing:
    key: ${JWT_KEY}
  access-ttl-minutes: 1440
  refresh-ttl-days: 180
  refresh-rotation-threshold-days: 30 # refresh заменяется новым, когда до его истечения остаётся не больше порога

storage:
  root: ${STORAGE_ROOT:storage} # корневая папка физического хранения файлов
  max-file-size-bytes: 104857600
  temp-dir: ${STORAGE_TEMP_DIR:${STORAGE_ROOT:storage}/tmp}
  pending-delete-interval: PT1M # пауза между проходами очистки .pending-delete
  physical-filename:
    original-name-max-length: 80

auth:
  request:
    activation-valid-days: 3
    reset-valid-days: 3
    active-max: 3

sync:
  checksum-exists:
    max-batch-size: 500

thumbnail:
  max-side: 320 # px, длинная сторона миниатюры; меньшие изображения не увеличиваются
  max-source-pixels: 100000000 # предел ширина×высота исходника
  max-full-decode-pixels: 8000000 # предел для WebP lossless и с прозрачностью: декодер выделяет память под полный кадр
  max-concurrent: 4 # одновременных генераций; сверх лимита — 503 без ожидания
  cache-max-age: PT24H # Cache-Control: private, max-age

sharing:
  # Публичный адрес Server для ссылок /s/{token}: https, http — только localhost. Пусто — LINK-ссылки недоступны.
  public-base-url: ${SHARING_PUBLIC_BASE_URL:}
  # Base64 32 байт, ключ AES-256 для секретов ссылок. Хранить вне Git вместе с резервной копией конфигурации:
  # без прежнего ключа выданные ссылки работают, но их URL повторно не получить. Пусто — LINK-ссылки недоступны.
  link-key: ${SHARING_LINK_KEY:}

logging:
  level:
    liquibase: info
    ru.tbcarus.photocloudserver: INFO
